<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6; }
      .box-head { fill: #1f242c; stroke: #30363d; stroke-width: 1; rx: 4; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
      .sub { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #8b949e; }
      .line { stroke: #58a6ff; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
      .line-red { stroke: #f85149; stroke-width: 1.5; marker-end: url(#arrow-red); fill: none; }
      .line-green { stroke: #3fb950; stroke-width: 1.5; marker-end: url(#arrow-green); fill: none; }
      .blue { fill: #58a6ff; }
      .green { fill: #3fb950; }
      .amber { fill: #d29922; }
      .red { fill: #f85149; }
      .white { fill: #f0f6fc; }
      .gray { fill: #8b949e; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#58a6ff" />
    </marker>
    <marker id="arrow-red" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#f85149" />
    </marker>
    <marker id="arrow-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#3fb950" />
    </marker>
  </defs>

  <rect width="1100" height="420" class="bg" />

  <!-- Title banner -->
  <rect x="30" y="20" width="1040" height="45" class="box" />
  <text x="45" y="47" class="title blue">dnswatch // Controlled RFC 1035 Sinkhole &amp; Threat Detection Architecture</text>
  <text x="910" y="47" class="sub">v0.1.0 SPECIFICATION</text>

  <!-- Node 1: Ingestion -->
  <rect x="30" y="90" width="180" height="130" class="box" />
  <rect x="30" y="90" width="180" height="30" class="box-head" />
  <text x="40" y="110" class="title blue">1. Ingestion</text>
  <text x="40" y="145" class="code white">UDP/53 Socket</text>
  <text x="40" y="165" class="sub">Raw datagram</text>
  <text x="40" y="190" class="code amber">TCP/53 Framing</text>
  <text x="40" y="205" class="sub">2B length prefix</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="210" y1="155" x2="250" y2="155" class="line" />

  <!-- Node 2: Blocklist Matcher -->
  <rect x="250" y="90" width="220" height="130" class="box" />
  <rect x="250" y="90" width="220" height="30" class="box-head" />
  <text x="260" y="110" class="title blue">2. Blocklist Matcher</text>
  <text x="260" y="145" class="code white">SinkholeBlocklist</text>
  <text x="260" y="165" class="sub">O(1) exact domain hash</text>
  <text x="260" y="185" class="code amber">Wildcard Suffix (*.)</text>
  <text x="260" y="205" class="sub">O(k) parent label lookup</text>

  <!-- Decision Branch: Blocked (Up) -->
  <path d="M 470 140 L 530 140 L 530 110 L 570 110" class="line-red" />
  <text x="480" y="125" class="code red font-bold">MATCH</text>

  <!-- Decision Branch: Clean (Down) -->
  <path d="M 470 170 L 530 170 L 530 290 L 570 290" class="line-green" />
  <text x="480" y="225" class="code green font-bold">CLEAN</text>

  <!-- Node 3A: RFC 1035 Synthetic Responder (Upper) -->
  <rect x="570" y="75" width="250" height="150" class="box" style="stroke: #f85149;" />
  <rect x="570" y="75" width="250" height="30" class="box-head" />
  <text x="585" y="95" class="title red">3A. Synthetic Responder</text>
  <text x="585" y="125" class="code white">Echo TXID &amp; Question</text>
  <text x="585" y="145" class="code amber">Flags: QR=1, AA=1, RA=1</text>
  <text x="585" y="165" class="code green">0xC00C Pointer Compression</text>
  <text x="585" y="185" class="sub">Synthetic A (0.0.0.0) / AAAA</text>
  <text x="585" y="205" class="sub">Authoritative NXDOMAIN (RCODE 3)</text>

  <!-- Node 3B: Passive Threat Analysis (Lower) -->
  <rect x="570" y="245" width="250" height="150" class="box" style="stroke: #3fb950;" />
  <rect x="570" y="245" width="250" height="30" class="box-head" />
  <text x="585" y="265" class="title green">3B. Threat Detectors</text>
  <text x="585" y="295" class="code blue">Shannon Entropy H(X)</text>
  <text x="585" y="315" class="sub">Single >= 20B / Chunked >= 32B</text>
  <text x="585" y="335" class="code amber">DNS Rebinding Detector</text>
  <text x="585" y="355" class="sub">Public domain -> RFC 1918 / 127.0.0.1</text>
  <text x="585" y="375" class="code red">Rolling NXDOMAIN Tracker</text>

  <!-- Arrows to Output -->
  <line x1="820" y1="150" x2="860" y2="150" class="line-red" />
  <line x1="820" y1="320" x2="860" y2="320" class="line-green" />

  <!-- Node 4: Outputs -->
  <rect x="860" y="75" width="210" height="320" class="box" />
  <rect x="860" y="75" width="210" height="30" class="box-head" />
  <text x="875" y="95" class="title blue">4. Telemetry Output</text>
  
  <text x="875" y="130" class="code red">Client Response</text>
  <text x="875" y="150" class="sub">Raw RFC 1035 UDP answer</text>
  <text x="875" y="170" class="sub">Instant sinkhole deflection</text>

  <line x1="875" y1="190" x2="1055" y2="190" style="stroke: #30363d; stroke-width: 1;" />

  <text x="875" y="220" class="code green">Structured JSONL</text>
  <text x="875" y="240" class="sub">Event: sinkhole_intercept</text>
  <text x="875" y="260" class="sub">Event: dns_rebinding_alert</text>
  <text x="875" y="280" class="sub">Event: tunnel_detected</text>
  <text x="875" y="300" class="sub">Event: nxdomain_burst</text>
  <text x="875" y="330" class="sub">SIEM / SOC ingestion stream</text>
  <text x="875" y="360" class="code white">pytest: 51/51 PASS</text>
</svg>
