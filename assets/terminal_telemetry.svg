<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      .term-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 8; }
      .term-header { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .term-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; text-anchor: middle; }
      .term-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; }
      .c-white { fill: #f0f6fc; }
      .c-gray { fill: #8b949e; }
      .c-blue { fill: #58a6ff; }
      .c-green { fill: #3fb950; }
      .c-amber { fill: #d29922; }
      .c-red { fill: #f85149; }
      .c-purple { fill: #bc8cff; }
      .c-cyan { fill: #39c5bb; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="920" height="440" class="term-bg" />

  <!-- Title Bar -->
  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 912 0 C 916.42 0 920 3.58 920 8 L 920 36 L 0 36 Z" class="term-header" />
  
  <!-- Window Control Buttons -->
  <circle cx="20" cy="18" r="6" class="dot-red" />
  <circle cx="38" cy="18" r="6" class="dot-yellow" />
  <circle cx="56" cy="18" r="6" class="dot-green" />
  
  <text x="460" y="22" class="term-title">dnswatch — user@workstation: ~ (udp/53 live capture &amp; sinkhole)</text>

  <!-- Terminal Content -->
  <g class="term-code" transform="translate(24, 65)">
    <!-- Command Line -->
    <text y="0" class="c-gray">$ <tspan class="c-green">dnswatch</tspan> <tspan class="c-white">--listen --host 127.0.0.1 --port 53 --sinkhole /etc/dnswatch/blocklist.txt</tspan></text>
    <text y="24" class="c-gray">listening for DNS datagrams on 127.0.0.1:53 [sinkhole: active (4,812 rules, return 0.0.0.0)] ...</text>

    <!-- Normal Query -->
    <text y="60" class="c-gray">[192.168.1.6:51240] txid=0x3a4b <tspan class="c-blue">query</tspan> A api.github.com -> <tspan class="c-green">NOERROR</tspan> (4 answers, rtt=14.2ms)</text>

    <!-- Blocked Sinkhole Query -->
    <text y="96" class="c-red">[SINKHOLE]</text>
    <text x="82" y="96" class="c-gray">[192.168.1.10:48912] blocked <tspan class="c-amber">ads.tracking.telemetry.test</tspan> -> <tspan class="c-green">SYNTHETIC A 0.0.0.0</tspan> (ttl=60s)</text>

    <!-- Tunneling Alert -->
    <text y="132" class="c-purple">[TUNNEL ALERT]</text>
    <text x="110" y="132" class="c-gray">client=192.168.1.9 domain=<tspan class="c-amber">a4f9b2c8e10d7a.v1.exfil.bad.org</tspan></text>
    <text y="152" class="c-gray" x="20">└─ entropy=<tspan class="c-red">4.18 bits</tspan> (threshold >= 3.75) prefix_len=36 [iodine/dnscat2 chunk detected]</text>

    <!-- DNS Rebinding Alert -->
    <text y="188" class="c-red">[REBINDING ALERT]</text>
    <text x="135" y="188" class="c-gray">domain=<tspan class="c-amber">attacker-controlled.site</tspan> resolved to <tspan class="c-red">127.0.0.1</tspan> (loopback)</text>
    <text y="208" class="c-gray" x="20">└─ SSRF threat flagged: public domain mapped to host loopback interface</text>

    <!-- NXDOMAIN Burst Alert -->
    <text y="244" class="c-amber">[BURST ANOMALY]</text>
    <text x="125" y="244" class="c-gray">client=192.168.1.8 rolling_window=60s queries=18 <tspan class="c-red">nxdomain=14 (77.8%)</tspan></text>
    <text y="264" class="c-gray" x="20">└─ DGA or aggressive recon burst threshold exceeded (ratio >= 50%)</text>

    <!-- Sinkhole NXDOMAIN Action -->
    <text y="300" class="c-red">[SINKHOLE]</text>
    <text x="82" y="300" class="c-gray">[192.168.1.4:61002] blocked <tspan class="c-amber">*.beacon.c2.org</tspan> -> <tspan class="c-red">SYNTHETIC NXDOMAIN</tspan> (rcode=3)</text>

    <!-- Active Status Line -->
    <text y="340" class="c-cyan">●</text>
    <text x="15" y="340" class="c-gray">dnswatch v0.1.0 engine active | 0 errors | zero external dependencies</text>
  </g>
</svg>
